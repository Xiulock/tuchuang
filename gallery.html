<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xiulock · 我的图床</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",sans-serif;color:#514a46;background:#faf8f5}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0%,#f5e9e5 0%,transparent 40%),#faf8f5;min-height:100vh}
header{padding:65px 20px 35px;text-align:center;background:transparent;color:#544943}
header h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(27px,5vw,42px);font-weight:400;letter-spacing:2px;margin:0 0 13px}
header p{margin:0;color:#a5968e;font-size:12px;letter-spacing:4px}
.wrap{max-width:1050px;margin:auto;padding:18px 22px 48px}
.panel{background:#fffdfb;border:1px solid #eee6df;border-radius:19px;padding:26px;margin-bottom:20px;box-shadow:0 7px 28px #8872630a}
h2{font-family:Georgia,"Songti SC",serif;font-size:19px;font-weight:500;letter-spacing:1px;margin:0 0 19px}
input[type=password],input[type=text]{width:100%;padding:13px 15px;border:1px solid #e8ded8;border-radius:11px;font-size:13px;color:#61544f;background:#fff;outline:none}
input:focus{border-color:#c3a69b;box-shadow:0 0 0 3px #c3a69b20}
button{background:#b5968c;border:1px solid #b5968c;color:white;padding:12px 17px;border-radius:11px;cursor:pointer;font-weight:500;letter-spacing:.5px;transition:background .2s,transform .2s}
button:hover{background:#9e7e74;transform:translateY(-1px)}
button.secondary{background:#f7f1ed;color:#8d736b;border-color:#efe4dd}
button.danger{background:#fff6f4;color:#b27e7b;border-color:#f0e0dd}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.flex input{flex:1;min-width:180px}
.muted{color:#a0948d;font-size:12px;line-height:1.9}
.drop{border:1.5px dashed #d7bfb6;background:#fdf9f7;border-radius:15px;padding:55px 18px;text-align:center;cursor:pointer;transition:background .2s}
.drop:before{content:"↥";display:block;color:#bb9a90;font-family:Georgia,serif;font-size:39px;line-height:1.1;margin-bottom:15px}
.drop.drag,.drop:hover{background:#f8efeb}
.drop strong{display:block;font-size:15px;font-weight:500;letter-spacing:1px;margin-bottom:9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px;margin-top:19px}
.item{border:1px solid #eee7e1;border-radius:15px;overflow:hidden;padding:11px;min-width:0;background:#fff;box-shadow:0 4px 16px #8872630a}
.preview{height:165px;background:#f7f2ee;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.preview img{width:100%;height:100%;object-fit:cover}.preview audio{width:95%}
.name{font-size:12px;font-weight:500;overflow-wrap:anywhere;margin:12px 2px;color:#665b55}
.item input{font-size:11px;background:#fcfaf8}.item .flex{margin-top:9px;gap:6px}
.item button{padding:8px 10px;font-size:11px;flex:1}
#status{white-space:pre-wrap;line-height:1.8;font-size:12px}
#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#62534d;color:white;padding:12px 22px;border-radius:12px;display:none;z-index:10;max-width:90vw;font-size:13px}
a{color:#a58175}
@media(max-width:600px){header{padding:42px 12px 18px}.wrap{padding:14px 14px 30px}.panel{padding:19px}.drop{padding:40px 12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{padding:7px}.preview{height:125px}.item button{padding:8px 4px;font-size:10px}.item .flex{gap:4px}}
</style></head><body><header><div class="wrap" style="padding:0"><h1>Xiulock · Gallery</h1><p>A LITTLE SPACE FOR BEAUTIFUL THINGS</p></div></header><main class="wrap"><section class="panel"><h2>01 / 访问设置</h2><div class="flex"><input type="password" id="token" placeholder="输入仅授权 tuchuang 仓库的 Fine-grained Token" autocomplete="off"><button id="save">本机保存</button><button class="secondary" id="clear">清除</button></div><p class="muted">Token 只保存在当前浏览器，不会上传到图床仓库。建议使用仅允许 tuchuang 仓库 Contents 读写的 Fine-grained Token；不要将此管理页面连同 Token 分享给别人。</p></section><section class="panel"><h2>02 / 上传素材</h2><div class="drop" id="drop"><strong>点击选择文件，或拖拽到这里</strong><span class="muted">支持 JPG、PNG、GIF、WEBP、SVG、BMP、ICO、MP3、WAV、M4A、OGG、FLAC、AAC · 可多选</span><input id="files" type="file" accept=".jpg,.jpeg,.png,.gif,.webp,.svg,.bmp,.ico,.mp3,.wav,.m4a,.ogg,.flac,.aac" multiple hidden></div><p id="status" class="muted"></p></section><section class="panel"><div class="flex" style="justify-content:space-between"><h2 style="margin:0">03 / 我的图库</h2><button id="refresh" class="secondary">刷新图库</button></div><div id="gallery" class="grid"></div><p id="empty" class="muted">点击“刷新图库”查看文件。</p></section></main><div id="toast"></div><script>
const OWNER='Xiulock',REPO='tuchuang',BRANCH='main';
const ROOT=`https://api.github.com/repos/${OWNER}/${REPO}/contents`;
const EXT=/\.(jpe?g|png|gif|webp|svg|bmp|ico|mp3|wav|m4a|ogg|flac|aac)$/i;
const AUDIO=/\.(mp3|wav|m4a|ogg|flac|aac)$/i;
const $=id=>document.getElementById(id);
let token=localStorage.getItem('xiulock_tuchuang_token')||'';$('token').value=token;
function toast(s){const t=$('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
function auth(){token=$('token').value.trim();if(!token){toast('请先填写 Token');throw Error('未设置 Token')}return {'Authorization':`Bearer ${token}`,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}
async function api(path,opts={}){const r=await fetch(ROOT+path,{...opts,headers:{...auth(),...(opts.headers||{})}});let data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.message||`HTTP ${r.status}`);return data}
function link(name){return `https://${OWNER.toLowerCase()}.github.io/${REPO}/${name.split('/').map(encodeURIComponent).join('/')}`}
function filename(name){return name.replace(/[^a-zA-Z0-9._-]/g,'_')}
function b64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)})}
$('save').onclick=()=>{token=$('token').value.trim();if(!token)return toast('Token 不能为空');localStorage.setItem('xiulock_tuchuang_token',token);toast('已保存到当前浏览器')};
$('clear').onclick=()=>{localStorage.removeItem('xiulock_tuchuang_token');$('token').value='';token='';toast('已清除本地 Token')};
$('drop').onclick=()=>$('files').click();
$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('drag')};
$('drop').ondragleave=()=>$('drop').classList.remove('drag');
$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('drag');upload(e.dataTransfer.files)};
$('files').onchange=e=>{upload(e.target.files);e.target.value=''};
async function upload(files){const list=[...files].filter(f=>EXT.test(f.name));if(!list.length)return toast('没有可上传的图片或音频');let ok=0;for(let i=0;i<list.length;i++){const f=list[i];const name=`${Date.now()}_${i}_${filename(f.name)}`;$('status').textContent=`正在上传 ${i+1}/${list.length}：${f.name}\n已完成 ${ok} 个`;try{await api('/'+encodeURIComponent(name),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:`Upload ${name}`,content:await b64(f),branch:BRANCH})});ok++}catch(e){$('status').textContent+=`\n上传失败：${f.name} — ${e.message}`}}$('status').textContent+=`\n上传结束：成功 ${ok}/${list.length}。GitHub Pages 外链可能需要短暂刷新才能生效。`;toast(`成功上传 ${ok} 个文件`);refresh()}
async function copy(s){try{await navigator.clipboard.writeText(s);toast('链接已复制')}catch(e){prompt('复制下面的链接',s)}}
function makeBtn(label,cls,fn){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;return b}
async function refresh(){$('gallery').replaceChildren();$('empty').textContent='正在读取图库…';try{const data=await api('?ref='+BRANCH);const files=data.filter(x=>x.type==='file'&&EXT.test(x.name));$('empty').textContent=files.length?'': '还没有上传图片或音频。';for(const f of files){const card=document.createElement('div');card.className='item';const p=document.createElement('div');p.className='preview';const url=link(f.path);if(AUDIO.test(f.name)){const a=document.createElement('audio');a.controls=true;a.src=url;p.append(a)}else{const img=document.createElement('img');img.src=url;img.loading='lazy';img.alt=f.name;p.append(img)}const n=document.createElement('div');n.className='name';n.textContent=f.name;const inp=document.createElement('input');inp.type='text';inp.readOnly=true;inp.value=url;const actions=document.createElement('div');actions.className='flex';actions.append(makeBtn('复制','',()=>copy(url)),makeBtn('打开','secondary',()=>window.open(url,'_blank','noopener')),makeBtn('删除','danger',async()=>{if(!confirm(`确定删除 ${f.name}？删除后原链接将失效。`))return;try{await api('/'+encodeURIComponent(f.path),{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:`Delete ${f.name}`,sha:f.sha,branch:BRANCH})});toast('已删除');refresh()}catch(e){toast('删除失败：'+e.message)}}));card.append(p,n,inp,actions);$('gallery').append(card)}}catch(e){$('empty').textContent='读取失败：'+e.message}}
$('refresh').onclick=refresh;if(token)refresh();
</script></body></html>
